name: Fetch jobs

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6–7am New York
  workflow_dispatch:         # run it anytime from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/fetch_jobs.py
      - name: Commit updated feed
        run: |
          git config user.name "linkup-bot"
          git config user.email "linkup-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m "Update job feed" && git push)
